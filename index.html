<!DOCTYPE html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<head>
    <meta charset="UTF-8">
    <title>Country Explorer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #ffffff;
            text-align: center;
        }

        #countryInput {
            color: #ffffff;
            padding: 10px;
            width: 200px;
            border: 2px solid #4e4e4e;
            border-radius: 5px;
            font-size: 16px;
            background: #1e293b;
            outline: none;
        }

        button {
            padding: 10px 10px;
            margin-left: 10px;
            margin-top: 10px;
            background: #1e293b;
            color: #c0ccdf;
            ;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #313d4e;
        }

        #result {
            margin-top: 20px;
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: left;
            color: rgb(255, 255, 255);
        }

        #result img {
            display: block;
            margin: 10px auto;
            border: 1px solid #ffffff;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h2>Country Explorer</h2>
    <input type="text" id="countryInput" placeholder="Enter Your Country">
    <button onclick="getCountryInfo()">Get Info</button>

    <div id="result"></div>

    <script>
        function getCountryInfo() {
            const country = document.getElementById('countryInput').value.trim();
            const resultDiv = document.getElementById('result');

            if (country === "") {
                resultDiv.innerHTML = "Please enter a country name.";
                ;
            }

            fetch(`https://restcountries.com/v3.1/name/${country}?fullText=true`)
                .then(response => {
                    return response.json();
                })
                .then(data => {
                    const info = data[0];

                    resultDiv.innerHTML = `
            <h3>${info.name.common}</h3>
            <p><strong>Capital:</strong>  ${info.capital}</p>
            <p><strong>Region:</strong> ${info.region}</p>
            <p><strong>Population:</strong> ${info.population.toLocaleString()}</p>
            <p><strong>Area:</strong> ${info.area.toLocaleString()} km²</p>
            <p><strong>Currency:</strong> ${Object.values(info.currencies)[0]?.name} (${Object.values(info.currencies)[0]?.symbol || "N/A"})</p>
            <img src="${info.flags.png}" alt="Flag" width="150">
           
          `;
                })
                .catch(err => {
                    resultDiv.innerHTML = "Error: " + err.message;
                });
        }
    </script>
</body>

</html>
